# docker-compose.ldmapp.yml
# POS Shop - Produccion en VPS ldmapp.com
# Puertos: 5437 (postgres), 6383 (redis), 4003 (backend), 3013 (frontend)

services:
  pos-postgres:
    image: postgres:16-alpine
    container_name: pos_ldmapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pos_ldmapp_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_ldmapp_net

  pos-redis:
    image: redis:7-alpine
    container_name: pos_ldmapp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - pos_ldmapp_redis:/data
    ports:
      - "127.0.0.1:6383:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_ldmapp_net

  pos-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pos_ldmapp_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pos-postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_HOST: pos-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      NODE_ENV: production
      FRONTEND_URL: https://pos.ldmapp.com
      USE_NUBEFACT: "true"
      NUBEFACT_DEMO: "true"
      NUBEFACT_FULL_URL: ${NUBEFACT_FULL_URL}
      NUBEFACT_TOKEN: ${NUBEFACT_TOKEN}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMPRESA_EMAIL: ${EMPRESA_EMAIL}
    volumes:
      - pos_ldmapp_uploads:/app/uploads
    ports:
      - "127.0.0.1:4003:4000"
    depends_on:
      pos-postgres:
        condition: service_healthy
      pos-redis:
        condition: service_healthy
    networks:
      - pos_ldmapp_net

  pos-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api-pos.ldmapp.com
    container_name: pos_ldmapp_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api-pos.ldmapp.com
      NEXT_PUBLIC_APP_NAME: POS Shop
    ports:
      - "127.0.0.1:3013:3000"
    depends_on:
      - pos-backend
    networks:
      - pos_ldmapp_net

volumes:
  pos_ldmapp_pgdata:
    name: pos_ldmapp_pgdata
  pos_ldmapp_redis:
    name: pos_ldmapp_redis
  pos_ldmapp_uploads:
    name: pos_ldmapp_uploads

networks:
  pos_ldmapp_net:
    name: pos_ldmapp_net
    driver: bridge
