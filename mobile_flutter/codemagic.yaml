# ==============================================================================
# codemagic.yaml
# Compila APK release en la nube. El artefacto queda en la URL pública del run.
# Conecta: codemagic.io → New app → GitHub repo → Apuntar a este archivo.
# ==============================================================================

workflows:
  android-apk:
    name: POS Shop · Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.ldmapp.pos.pos_mobile"
    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.pub-cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
    scripts:
      - name: Set up local properties
        script: |
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/mobile_flutter/android/local.properties"
      - name: Get Flutter packages
        script: |
          cd $CM_BUILD_DIR/mobile_flutter
          flutter pub get
      - name: Run analyzer
        script: |
          cd $CM_BUILD_DIR/mobile_flutter
          flutter analyze --no-fatal-warnings || true
      - name: Build APK release
        script: |
          cd $CM_BUILD_DIR/mobile_flutter
          flutter build apk --release --split-per-abi
    artifacts:
      - mobile_flutter/build/app/outputs/flutter-apk/*.apk
      - mobile_flutter/build/app/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - cesar.rami6191@gmail.com
        notify:
          success: true
          failure: true
