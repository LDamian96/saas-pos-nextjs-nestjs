## Ajustado para PC con 8 GB RAM total — debe caber Gradle + Android Studio + el sistema.
## Si subes a una PC con más RAM, podés subir Xmx a 4G/8G.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

## Force Gradle to use JDK 17 (system JAVA_HOME points to JDK 11).
org.gradle.java.home=C:/Program Files/Java/jdk-17

## Performance — sólo un daemon, sin paralelismo agresivo en builds chicos.
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.configureondemand=true
org.gradle.caching=true

## Kotlin daemon — limita su memoria también.
kotlin.daemon.jvm.options=-Xmx768m

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
