name: pos_mobile
description: "POS Shop - Aplicacion movil de punto de venta ultramoderna"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ─── Animaciones premium (estilo GSAP en movil) ────────────────────
  flutter_animate: ^4.5.0
  rive: ^0.13.13
  lottie: ^3.1.3
  animations: ^2.0.11
  flutter_staggered_animations: ^1.1.1

  # ─── UI moderna ────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.0.5
  shimmer: ^3.0.0
  smooth_sheets: ^0.10.0
  gap: ^3.0.1
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1

  # ─── State + Routing ──────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  # ─── Networking + offline ─────────────────────────────────────────
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.0
  internet_connection_checker_plus: ^2.5.2

  # ─── Storage seguro + DB local ────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.4
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # ─── Biometria + permisos ─────────────────────────────────────────
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.4
  permission_handler: ^11.3.1

  # ─── Camara / escaner ────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0

  # ─── PDF + impresion ─────────────────────────────────────────────
  pdf: ^3.11.1
  printing: ^5.13.4
  esc_pos_utils_plus: ^2.0.4
  flutter_blue_plus: ^1.34.5

  # ─── Compartir / WhatsApp ────────────────────────────────────────
  url_launcher: ^6.3.1
  share_plus: ^10.1.2

  # ─── Feedback UX ─────────────────────────────────────────────────
  toastification: ^2.3.0
  flutter_native_splash: ^2.4.3

  # ─── Charts (v3) ─────────────────────────────────────────────────
  fl_chart: ^0.69.2

  # ─── Code generation models ──────────────────────────────────────
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ─── Utils ───────────────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  dartz: ^0.10.1
  logger: ^2.5.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  very_good_analysis: ^7.0.0

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  drift_dev: ^2.22.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/rive/
    - assets/lottie/
